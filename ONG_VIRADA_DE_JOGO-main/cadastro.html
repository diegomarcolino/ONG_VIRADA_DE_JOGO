<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site de uma ong especializada em acolhimento de ludopáticos">
    <title>ONG - VIRADA DE JOGO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <img src="assets/logo.png" alt="LOGO DA ONG">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="ajuda.html">Como Ajudar</a></li>
                <li><a style="color: black;" href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
        
    </header>
    <main class="form-container">
        <h1>Formulário de Cadastro</h1>
        <p class="descricao">Faça parte da ONG Virada de Jogo! Preencha seus dados para se cadastrar como voluntário ou parceiro.</p>

        <form action="#" method="POST">
            
            <!-- AGRUPAMENTO LÓGICO 1: DADOS PESSOAIS -->
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome completo">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">
                    </div>

                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento *</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone / WhatsApp *</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000" maxlength="15" pattern="\(\d{2}\) \d{4,5}-\d{4}">
                    </div>
                </div>
            </fieldset>

            <!-- AGRUPAMENTO LÓGICO 2: ENDEREÇO -->
            <fieldset>
                <legend>Endereço</legend>

                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" name="cep" required placeholder="00000-000" maxlength="9" pattern="\d{5}-\d{3}">
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label for="estado">Estado *</label>
                        <select id="estado" name="estado" required>
                            <option value="">Selecione...</option>
                            <option value="SP">São Paulo</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PR">Paraná</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="RS">Rio Grande do Sul</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" required placeholder="Sua cidade">
                    </div>

                    <div class="form-group" style="flex: 2;">
                        <label for="endereco">Endereço (Rua, Nº, Bairro) *</label>
                        <input type="text" id="endereco" name="endereco" required placeholder="Rua, número e bairro">
                    </div>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Finalizar Cadastro</button>
        </form>
    </main>

    <!-- MÁSCARAS DE INPUT EM JAVASCRIPT -->
    <script>
        const cpfInput = document.getElementById('cpf');
        cpfInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });

        const telInput = document.getElementById('telefone');
        telInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
            if (v.length > 13) {
                v = v.replace(/(\d{5})(\d)/, '$1-$2');
            } else {
                v = v.replace(/(\d{4})(\d)/, '$1-$2');
            }
            e.target.value = v;
        });

        const cepInput = document.getElementById('cep');
        cepInput.addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 8) v = v.slice(0, 8);
            v = v.replace(/^(\d{5})(\d)/, '$1-$2');
            e.target.value = v;
        });
    </script>
</body> 
</html>
